<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Clock Debug</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#1b1b1b;
    color:#fff;
    padding:20px;
}

.card{
    background:#2b2b2b;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
}

input{
    width:320px;
    padding:6px;
}

button{
    padding:8px 14px;
    margin:4px;
}

.value{
    color:#7dff7d;
    font-family:Consolas,monospace;
    font-size:18px;
}

pre{
    background:#111;
    padding:10px;
    border-radius:6px;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:500px;
    overflow:auto;
}
</style>

</head>
<body>

<h2>Secure Clock Debug</h2>

<div class="card">

Timezone

<br><br>

<input
id="timezone"
value="Europe/Warsaw">

<button onclick="syncClock()">
Sync
</button>

<button onclick="document.getElementById('log').textContent=''">
Clear Log
</button>

</div>

<div class="card">
<b>Status</b>
<div id="status">Idle</div>
</div>

<div class="card">

<b>Secure Clock</b>

<div class="value" id="secure">
Not synced
</div>

<br>

<b>Device Clock</b>

<div class="value" id="device">
-
</div>

</div>

<div class="card">

<div>RTT:
<span id="rtt"></span>
</div>

<div>Latency:
<span id="latency"></span>
</div>

<div>Difference:
<span id="difference"></span>
</div>

</div>

<div class="card">

<b>Browser Info</b>

<pre id="browser"></pre>

</div>

<div class="card">

<b>API JSON</b>

<pre id="json"></pre>

</div>

<div class="card">

<b>Debug Log</b>

<pre id="log"></pre>

</div>

<script>

const browser=document.getElementById("browser");

browser.textContent=
JSON.stringify({

origin:location.origin,
href:location.href,
protocol:location.protocol,
secureContext:window.isSecureContext,
online:navigator.onLine,
userAgent:navigator.userAgent,
language:navigator.language,
platform:navigator.platform,
hardwareConcurrency:navigator.hardwareConcurrency,
deviceMemory:navigator.deviceMemory,
connection:navigator.connection||null

},null,4);

let clock=null;

function log(...args){

    console.log(...args);

    const el=document.getElementById("log");

    const txt=args.map(v=>{

        if(typeof v==="string")
            return v;

        try{
            return JSON.stringify(v,null,2);
        }
        catch{
            return String(v);
        }

    }).join(" ");

    el.textContent+=
`[${new Date().toISOString()}]
${txt}

`;

    el.scrollTop=el.scrollHeight;

}

window.onerror=function(message,source,line,col,error){

    log("WINDOW ERROR");

    log(message);

    log(source);

    log(line);

    log(col);

    log(error);

};

window.addEventListener("unhandledrejection",e=>{

    log("UNHANDLED PROMISE");

    log(e.reason);

});

async function doFetch(url){

    log("==================================================");

    log("URL",url);

    const deviceBefore=Date.now();
    const perfBefore=performance.now();

    log("Device before",deviceBefore);
    log("Perf before",perfBefore);

    try{

        const response=await fetch(url,{
            method:"GET",
    //      mode:"cors",
            cache:"no-store",
     //       credentials:"omit",
      //      redirect:"follow"
        });

        log("Response object",response);

        log("Status",response.status);

        log("StatusText",response.statusText);

        log("Type",response.type);

        log("Redirected",response.redirected);

        log("URL Returned",response.url);

        log("Headers");

        for(const pair of response.headers.entries()){

            log(pair[0]+" = "+pair[1]);

        }

        const text=await response.text();

        log("Body length",text.length);

        log(text);

        return{

            text,
            deviceBefore,
            deviceAfter:Date.now(),
            perfBefore,
            perfAfter:performance.now()

        };

    }

    catch(err){

        log("PRIMARY FETCH FAILED");

        log(err);

        log(err.name);

        log(err.message);

        const proxy=
"https://cors.isomorphic-git.org/"+url;

        log("Trying proxy");

        log(proxy);

        try{

            const response=await fetch(proxy,{

                method:"GET",
                cache:"no-store"

            });

            log("Proxy status",response.status);

            const text=await response.text();

            log("Proxy body");

            log(text);

            return{

                text,
                deviceBefore,
                deviceAfter:Date.now(),
                perfBefore,
                perfAfter:performance.now()

            };

        }

        catch(proxyErr){

            log("PROXY FAILED");

            log(proxyErr);

            throw proxyErr;

        }

    }

}

async function syncClock(){

    document.getElementById("status").textContent="Syncing...";

    document.getElementById("json").textContent="";

    try{

        const tz=document.getElementById("timezone").value;

        const url=
`https://timeapi.io/api/v1/time/current/zone?timezone=${encodeURIComponent(tz)}`;

        const result=
await doFetch(url);

        document.getElementById("json").textContent=result.text;

        const json=
JSON.parse(result.text);

        const server=
new Date(json.date_time).getTime();

        const rtt=
result.perfAfter-result.perfBefore;

        const latency=
rtt/2;

        clock={

            baseServer:server,
            basePerf:performance.now(),
            rtt,
            latency

        };

        document.getElementById("status").textContent="Synced";

        log("Clock initialized");

        log(clock);

    }

    catch(e){

        document.getElementById("status").textContent=
"FAILED";

        log("SYNC FAILED");

        log(e);

    }

}

function secureNow(){

    if(!clock)
        return null;

    return clock.baseServer+
        clock.latency+
        (performance.now()-clock.basePerf);

}

setInterval(()=>{

    document.getElementById("device").textContent=
new Date().toISOString();

    if(!clock)
        return;

    const now=
secureNow();

    document.getElementById("secure").textContent=
new Date(now).toISOString();

    document.getElementById("rtt").textContent=
clock.rtt.toFixed(2)+" ms";

    document.getElementById("latency").textContent=
clock.latency.toFixed(2)+" ms";

    document.getElementById("difference").textContent=
(now-Date.now()).toFixed(2)+" ms";

},50);

</script>

</body>
</html>
