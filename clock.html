<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Clock Debug</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#1b1b1b;
    color:#fff;
    padding:20px;
}

.card{
    background:#2b2b2b;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
}

input,select{
    width:320px;
    padding:6px;
    margin:4px 0;
}

button{
    padding:8px 14px;
    margin:4px;
}

.value{
    color:#7dff7d;
    font-family:Consolas,monospace;
    font-size:18px;
}

pre{
    background:#111;
    padding:10px;
    border-radius:6px;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:500px;
    overflow:auto;
}
</style>

</head>
<body>

<h2>Secure Clock Debug</h2>

<div class="card">

<b>Provider</b><br>

<select id="provider">
    <option value="timeapi">timeapi.io</option>
    <option value="worldtime" selected>time.now / WorldTimeAPI</option>
</select>

<br><br>

<b>Timezone</b><br>

<input
id="timezone"
value="Europe/Warsaw">

<br><br>

<button onclick="syncClock()">Sync</button>

<button onclick="document.getElementById('log').textContent=''">
Clear Log
</button>

</div>

<div class="card">
<b>Status</b>
<div id="status">Idle</div>
</div>

<div class="card">

<b>Secure Clock</b>

<div class="value" id="secure">
Not synced
</div>

<br>

<b>Device Clock</b>

<div class="value" id="device">
-
</div>

</div>

<div class="card">

<div>RTT:
<span id="rtt"></span>
</div>

<div>Estimated latency:
<span id="latency"></span>
</div>

<div>Difference vs device:
<span id="difference"></span>
</div>

</div>

<div class="card">

<b>Browser Info</b>

<pre id="browser"></pre>

</div>

<div class="card">

<b>Raw API JSON</b>

<pre id="json"></pre>

</div>

<div class="card">

<b>Debug Log</b>

<pre id="log"></pre>

</div>

<script>

const browser=document.getElementById("browser");

browser.textContent=JSON.stringify({

origin:location.origin,
href:location.href,
protocol:location.protocol,
secureContext:window.isSecureContext,
online:navigator.onLine,
userAgent:navigator.userAgent,
language:navigator.language,
platform:navigator.platform,
hardwareConcurrency:navigator.hardwareConcurrency,
deviceMemory:navigator.deviceMemory,
connection:navigator.connection||null

},null,4);

let clock=null;

function log(...args){

    console.log(...args);

    const el=document.getElementById("log");

    const txt=args.map(v=>{

        if(typeof v==="string")
            return v;

        if(v instanceof Error)
            return `${v.name}: ${v.message}\n${v.stack}`;

        try{
            return JSON.stringify(v,null,2);
        }
        catch{
            return String(v);
        }

    }).join(" ");

    el.textContent+=`[${new Date().toISOString()}]
${txt}

`;

    el.scrollTop=el.scrollHeight;

}

window.onerror=function(message,source,line,col,error){

    log("WINDOW ERROR");
    log(message);
    log(source);
    log(line);
    log(col);
    log(error);

};

window.addEventListener("unhandledrejection",e=>{

    log("UNHANDLED PROMISE");
    log(e.reason);

});

async function doFetch(url){

    log("==================================================");
    log("Request URL",url);

    const deviceBefore=Date.now();
    const perfBefore=performance.now();

    log("Device before",deviceBefore);
    log("Performance before",perfBefore);

    const response=await fetch(url,{
        method:"GET",
        cache:"no-store",
        credentials:"omit",
        redirect:"follow"
    });

    const deviceAfter=Date.now();
    const perfAfter=performance.now();

    log("Status",response.status);
    log("OK",response.ok);
    log("Type",response.type);
    log("Redirected",response.redirected);
    log("Final URL",response.url);

    for(const [k,v] of response.headers.entries())
        log(k+" = "+v);

    const text=await response.text();

    log("Body length",text.length);
    log(text);

    return{
        text,
        deviceBefore,
        deviceAfter,
        perfBefore,
        perfAfter
    };

}

async function syncClock(){

    document.getElementById("status").textContent="Syncing...";
    document.getElementById("json").textContent="";

    try{

        const provider=document.getElementById("provider").value;
        const timezone=document.getElementById("timezone").value;

        let url;

        if(provider==="timeapi"){

            url=`https://timeapi.io/api/v1/time/current/zone?timezone=${encodeURIComponent(timezone)}`;

        }else{

            url=`https://time.now/developer/api/timezone/${timezone}`;

        }

        log("Provider",provider);

        const result=await doFetch(url);

        document.getElementById("json").textContent=result.text;

        const json=JSON.parse(result.text);

        let serverTime;

        if(provider==="timeapi"){

            serverTime=new Date(json.date_time).getTime();

        }else{

            serverTime=new Date(json.datetime).getTime();

        }

        const rtt=result.perfAfter-result.perfBefore;
        const latency=rtt/2;

        clock={

            provider,
            timezone,
            serverTime,
            basePerf:performance.now(),
            latency,
            rtt,
            raw:json

        };

        log("Server timestamp",serverTime);
        log("Server ISO",new Date(serverTime).toISOString());
        log("RTT",rtt);
        log("Latency estimate",latency);

        document.getElementById("status").textContent="Synced";

    }
    catch(err){

        log("SYNC FAILED");
        log(err);

        document.getElementById("status").textContent=
            "FAILED: "+err.message;

    }

}

function secureNow(){

    if(!clock)
        return null;

    return clock.serverTime
        +clock.latency
        +(performance.now()-clock.basePerf);

}

setInterval(()=>{

    document.getElementById("device").textContent=
        new Date().toISOString();

    if(!clock)
        return;

    const now=secureNow();

    document.getElementById("secure").textContent=
        new Date(now).toISOString();

    document.getElementById("rtt").textContent=
        clock.rtt.toFixed(2)+" ms";

    document.getElementById("latency").textContent=
        clock.latency.toFixed(2)+" ms";

    document.getElementById("difference").textContent=
        (now-Date.now()).toFixed(2)+" ms";

},50);

</script>

</body>
</html>
