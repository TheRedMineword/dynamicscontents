<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Clock Debug</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#1b1b1b;
    color:#fff;
    padding:20px;
}

.card{
    background:#2b2b2b;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
}

input,select{
    width:320px;
    padding:6px;
    margin:4px 0;
}

button{
    padding:8px 14px;
    margin:4px;
}

.value{
    color:#7dff7d;
    font-family:Consolas,monospace;
    font-size:18px;
}

pre{
    background:#111;
    padding:10px;
    border-radius:6px;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:500px;
    overflow:auto;
}
</style>

</head>
<body>

<h2>Secure Clock Debug</h2>

<div class="card">

<b>Provider</b><br>

<select id="provider">
    <option value="timeapi">timeapi.io</option>
    <option value="worldtime" selected>time.now / WorldTimeAPI</option>
</select>

<br><br>

<b>Timezone</b><br>

<input
id="timezone"
value="Europe/Warsaw">

<br><br>

<button onclick="syncClock()">Sync</button>

<button onclick="document.getElementById('log').textContent=''">
Clear Log
</button>

</div>

<div class="card">
<b>Status</b>
<div id="status">Idle</div>
</div>

<div class="card">

<b>Secure Clock</b>

<div class="value" id="secure">
Not synced
</div>

<br>

<b>Device Clock</b>

<div class="value" id="device">
-
</div>

</div>

<div class="card">

<div>RTT:
<span id="rtt"></span>
</div>

<div>Estimated latency:
<span id="latency"></span>
</div>

<div>Difference vs device:
<span id="difference"></span>
</div>

</div>

<div class="card">

<b>Browser Info</b>

<pre id="browser"></pre>

</div>

<div class="card">

<b>Raw API JSON</b>

<pre id="json"></pre>

</div>

<div class="card">

<b>Debug Log</b>

<pre id="log"></pre>

</div>

<script>

const browser=document.getElementById("browser");

browser.textContent=JSON.stringify({
    origin:location.origin,
    href:location.href,
    protocol:location.protocol,
    secureContext:window.isSecureContext,
    online:navigator.onLine,
    userAgent:navigator.userAgent,
    language:navigator.language,
    hardwareConcurrency:navigator.hardwareConcurrency,
    deviceMemory:navigator.deviceMemory,
    connection:navigator.connection||null
},null,4);

let clock=null;

function log(...args){

    console.log(...args);

    const el=document.getElementById("log");

    const txt=args.map(v=>{

        if(v instanceof Error)
            return `${v.name}: ${v.message}\n${v.stack}`;

        if(typeof v==="string")
            return v;

        try{
            return JSON.stringify(v,null,2);
        }catch{
            return String(v);
        }

    }).join(" ");

    el.textContent+=`[${new Date().toISOString()}]
${txt}

`;

    el.scrollTop=el.scrollHeight;

}

window.onerror=(...a)=>log("WINDOW ERROR",a);

window.addEventListener("unhandledrejection",e=>{
    log("PROMISE",e.reason);
});

async function syncClock(){

    document.getElementById("status").textContent="Syncing...";
    document.getElementById("json").textContent="";

    try{

        const provider=document.getElementById("provider").value;
        const timezone=document.getElementById("timezone").value;

        let url;

        if(provider==="timeapi"){

            url=`https://timeapi.io/api/v1/time/current/zone?timezone=${encodeURIComponent(timezone)}`;

        }else{

            url=`https://time.now/developer/api/timezone/${timezone}`;

        }

        log("Provider",provider);
        log("Timezone",timezone);

        const perfRequestStart=performance.now();
        const deviceRequestStart=Date.now();

        const response=await fetch(url,{
            cache:"no-store",
            credentials:"omit"
        });

        const perfHeaders=performance.now();
        const deviceHeaders=Date.now();

        const body=await response.text();

        const perfBody=performance.now();

        document.getElementById("json").textContent=body;

        const json=JSON.parse(body);

        let serverTimestamp;

        if(provider==="timeapi"){

            serverTimestamp=new Date(json.date_time).getTime();

        }else{

            serverTimestamp=new Date(json.datetime).getTime();

        }

        const rtt=perfHeaders-perfRequestStart;

        const midpoint=(perfRequestStart+perfHeaders)/2;

        clock={

            provider,

            timezone,

            serverTimestamp,

            syncPointPerf:midpoint,

            requestStartPerf:perfRequestStart,

            headersPerf:perfHeaders,

            bodyPerf:perfBody,

            requestStartDevice:deviceRequestStart,

            headersDevice:deviceHeaders,

            rtt,

            estimatedError:rtt/2,

            raw:json

        };

        log("========== CLOCK ==========");

        log(clock);

        log("Server UTC",
            new Date(serverTimestamp).toISOString());

        log("RTT",rtt);

        log("Midpoint",midpoint);

        log("Estimated error ±",rtt/2);

        document.getElementById("status").textContent="Synced";

    }catch(e){

        log(e);

        document.getElementById("status").textContent=
            "FAILED";

    }

}

function secureTimestamp(){

    if(!clock)
        return null;

    return clock.serverTimestamp+
        (performance.now()-clock.syncPointPerf);

}

function formatServerTime(ms){

    return new Intl.DateTimeFormat(
        "sv-SE",
        {
            timeZone:clock.timezone,
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            fractionalSecondDigits:3,
            hour12:false
        }
    ).format(new Date(ms));

}

function update(){

    document.getElementById("device").textContent=
        new Date().toISOString();

    if(clock){

        const secure=secureTimestamp();

        document.getElementById("secure").textContent=
            formatServerTime(secure);

        document.getElementById("rtt").textContent=
            clock.rtt.toFixed(2)+" ms";

        document.getElementById("latency").textContent=
            "±"+clock.estimatedError.toFixed(2)+" ms";

        document.getElementById("difference").textContent=
            (secure-Date.now()).toFixed(2)+" ms";

    }

    requestAnimationFrame(update);

}

update();

</script>
</body>
</html>
